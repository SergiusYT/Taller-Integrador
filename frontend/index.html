<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Cliente</title>
</head>
<body>
  <h2>Registrar Cliente</h2>
  <form id="formCliente">
    <input type="text" name="n_identificacion" placeholder="Identificación" required><br>
    <input type="text" name="nombre" placeholder="Nombre" required><br>
    <input type="text" name="apellido" placeholder="Apellido" required><br>
    <input type="email" name="correo" placeholder="Correo electrónico" required><br>
    <button type="submit">Registrar</button>
  </form>

  <p id="mensaje"></p>

  <script>
    document.getElementById('formCliente').addEventListener('submit', async e => {
      e.preventDefault();
      const form = e.target;
      const datos = {
        n_identificacion: form.n_identificacion.value,
        nombre: form.nombre.value,
        apellido: form.apellido.value,
        correo: form.correo.value
      };

        const mensaje = document.getElementById('mensaje');

        // Validar correo antes de enviar
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(datos.correo)) {
            mensaje.textContent = '❌ El correo no tiene un formato válido';
            return;
        }


      const res = await fetch('http://localhost:3000/clientes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });

      if (res.ok) {
        mensaje.textContent = '✅ Cliente registrado exitosamente';
        form.reset();
      } else {
        const err = await res.json();
        mensaje.textContent = `❌ ${err.mensaje}`;
      }
    });
  </script>
</body>
</html>
