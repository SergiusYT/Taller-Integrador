<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro de Tarjeta</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    input, button { margin: 10px 0; padding: 8px; width: 300px; font-size: 16px; }
    p { font-weight: bold; }
  </style>
</head>
<body>
  <h2>Registrar Tarjeta</h2>
  <form id="formTarjeta" autocomplete="off">
    <input type="text" name="n_identificacion" placeholder="Número de Identificación del Cliente" required><br>

    <input 
      type="text" 
      name="numero_tarjeta" 
      placeholder="Número de Tarjeta (15-16 dígitos)" 
      required 
      maxlength="16"
      pattern="^\d{15,16}$"
      title="Debe contener solo números, entre 15 y 16 dígitos"
      inputmode="numeric"
    ><br>

    <input 
      type="text" 
      name="fecha_vencimiento" 
      placeholder="MM/YYYY" 
      required 
      maxlength="7"
      pattern="^(0[1-9]|1[0-2])\/\d{4}$"
      title="Formato válido MM/YYYY"
      inputmode="numeric"
    ><br>

    <input 
      type="text" 
      name="cupo_total" 
      placeholder="Cupo Total" 
      required 
      inputmode="decimal"
      pattern="^\d+(\.\d{1,2})?$"
      title="Número válido (puede incluir decimales)"
    ><br>

    <input 
      type="text" 
      name="cupo_disponible" 
      placeholder="Cupo Disponible" 
      required 
      inputmode="decimal"
      pattern="^\d+(\.\d{1,2})?$"
      title="Número válido (puede incluir decimales)"
    ><br>

    <button type="submit">Registrar Tarjeta</button>
  </form>

  <p id="mensajeTarjeta"></p>

  <script>
    const form = document.getElementById('formTarjeta');
    const numeroTarjeta = form.numero_tarjeta;
    const fechaVenc = form.fecha_vencimiento;
    const cupoTotal = form.cupo_total;
    const cupoDisp = form.cupo_disponible;

    // Permitir solo números en campos numéricos y limitar longitud
    function soloNumeros(event) {
      const allowedKeys = ['Backspace', 'ArrowLeft', 'ArrowRight', 'Delete', 'Tab'];
      if (
        allowedKeys.includes(event.key) || 
        (event.key >= '0' && event.key <= '9') || 
        (event.target === cupoTotal || event.target === cupoDisp) && event.key === '.'
      ) {
        // para decimales solo un punto
        if ((event.target === cupoTotal || event.target === cupoDisp) && event.key === '.') {
          if (event.target.value.includes('.')) {
            event.preventDefault();
          }
        }
        return;
      }
      event.preventDefault();
    }

    numeroTarjeta.addEventListener('keydown', e => {
      // Permitir solo números y borrar, flechas, tab
      const allowedKeys = ['Backspace', 'ArrowLeft', 'ArrowRight', 'Delete', 'Tab'];
      if (!allowedKeys.includes(e.key) && (e.key < '0' || e.key > '9')) {
        e.preventDefault();
      }
      // Limitar a 16 caracteres
      if (numeroTarjeta.value.length >= 16 && !allowedKeys.includes(e.key)) {
        e.preventDefault();
      }
    });

    cupoTotal.addEventListener('keydown', soloNumeros);
    cupoDisp.addEventListener('keydown', soloNumeros);

    // Formatear la fecha automáticamente como MM/YYYY
    fechaVenc.addEventListener('input', e => {
      let val = fechaVenc.value;
      // eliminar todo menos números y /
      val = val.replace(/[^\d\/]/g, '');

      // si el usuario escribe sin /, insertar slash después de 2 dígitos
      if (val.length === 2 && !val.includes('/')) {
        if (parseInt(val) > 12) val = '12';
        val += '/';
      }
      // limitar longitud a 7 caracteres
      if (val.length > 7) val = val.slice(0, 7);

      fechaVenc.value = val;
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();

      // Validar adicionalmente fecha correcta
      const fecha = fechaVenc.value;
      const fechaRegex = /^(0[1-9]|1[0-2])\/\d{4}$/;
      if (!fechaRegex.test(fecha)) {
        alert('Fecha inválida. Formato MM/YYYY');
        return;
      }

      // Validar número tarjeta longitud 15 o 16
      if (!/^\d{15,16}$/.test(numeroTarjeta.value)) {
        alert('Número de tarjeta debe tener entre 15 y 16 dígitos numéricos');
        return;
      }

      // Validar cupos como números válidos (pueden tener decimales)
      if (isNaN(parseFloat(cupoTotal.value)) || parseFloat(cupoTotal.value) < 0) {
        alert('Cupo Total inválido');
        return;
      }
      if (isNaN(parseFloat(cupoDisp.value)) || parseFloat(cupoDisp.value) < 0) {
        alert('Cupo Disponible inválido');
        return;
      }

      const datos = {
        n_identificacion: form.n_identificacion.value.trim(),
        numero_tarjeta: numeroTarjeta.value.trim(),
        fecha_vencimiento: fechaVenc.value.trim(),
        cupo_total: parseFloat(cupoTotal.value),
        cupo_disponible: parseFloat(cupoDisp.value)
      };

      const mensaje = document.getElementById('mensajeTarjeta');

      try {
        const res = await fetch('http://localhost:3000/tarjetas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });
        const r = await res.json();
        mensaje.textContent = r.mensaje;
        mensaje.style.color = res.ok ? 'green' : 'red';
        if (res.ok) form.reset();
      } catch (error) {
        mensaje.textContent = 'Error al enviar los datos.';
        mensaje.style.color = 'red';
      }
    });
  </script>
</body>
</html>
